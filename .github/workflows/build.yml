name: Build LWIP Libraries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lib-builder
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone correct Arduino and IDF versions
        run: |
          # Клонируем Arduino 3.3.12 (тег)
          rm -rf arduino-esp32
          git clone --branch 3.3.12 --depth 1 https://github.com/espressif/arduino-esp32.git

          # Клонируем ESP-IDF v5.5.5 (тег)
          rm -rf esp-idf
          git clone --branch v5.5.5 --depth 1 https://github.com/espressif/esp-idf.git

      - name: Install ESP-IDF tools
        run: |
          cd esp-idf
          ./install.sh esp32,esp32s3
          . ./export.sh
          cd ..

      - name: Patch build.sh for idf-libs argument
        run: |
          # Исправляем баг с дефисом/подчеркиванием
          sed -i 's/idf-libs/idf_libs/g' build.sh

      - name: Debug - list files
        run: |
          ls -la
          ls -la arduino-esp32 || echo "arduino-esp32 not found"

      - name: Patch sketch.cpp for library build
        run: |
          # Создаем минимальную заглушку в папке main, которую использует build.sh
          cat > main/sketch.cpp << 'EOF'
          extern "C" void app_main(void) {
              // Empty stub for successful linking
          }
          EOF

      - name: Build libraries
        run: |
          # Активируем IDF (важно!)
          . ./esp-idf/export.sh
          
          # Запускаем сборку с флагом -s (пропустить обновление)
          ./build.sh -s -t "esp32,esp32s3" -b idf_libs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-lwip-libs-3.3.12
          path: out/tools/esp32-arduino-libs/
