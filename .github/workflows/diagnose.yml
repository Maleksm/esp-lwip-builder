name: Diagnose Exact Build Versions

'on':
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current lib-builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare builder with Espressif upstream
        shell: bash
        run: |
          set -u

          echo "========== CURRENT BUILDER =========="
          echo "Remote:"
          git remote -v
          echo
          echo "Commit:"
          git log -1 --format='%H%n%ci%n%s'
          echo
          echo "Description:"
          git describe --tags --always --dirty
          echo
          echo "Working tree:"
          git status --short

          echo
          echo "========== ESPRESSIF UPSTREAM =========="
          git remote add upstream \
            https://github.com/espressif/esp32-arduino-lib-builder.git
          git fetch upstream --tags

          echo "Upstream master:"
          git log -1 upstream/master --format='%H%n%ci%n%s'

          echo
          echo "Common ancestor:"
          git merge-base HEAD upstream/master || true

          echo
          echo "Differences from upstream master:"
          git diff --stat upstream/master...HEAD || true

          echo
          echo "Changed tracked files:"
          git diff --name-status upstream/master...HEAD || true

          echo
          echo "========== ESPRESSIF RELEASE V5.5 =========="
          git show -s --format='%H%n%ci%n%s' \
            idf-release_v5.5

          echo
          echo "Differences from idf-release_v5.5:"
          git diff --stat idf-release_v5.5...HEAD || true

          echo
          echo "Changed files:"
          git diff --name-status idf-release_v5.5...HEAD || true

          echo
          echo "========== IMPORTANT CONFIG DIFF =========="
          git diff idf-release_v5.5...HEAD -- \
            configs/defconfig.common tools/config.sh || true

          echo
          echo "========== ESPRESSIF RELEASE TAG =========="
          git show -s --format='%H%n%ci%n%s' \
            idf-release_v5.5

          echo
          echo "========== FORK BASE COMMIT =========="
          BASE=$(git merge-base HEAD upstream/master)
          git show -s --format='%H%n%ci%n%s' "$BASE"

          echo
          echo "========== RELEASE BRANCHES =========="
          git branch -r --list 'upstream/release/*'

          echo
          echo "========== BASE CONTAINED IN BRANCHES =========="
          git branch -r --contains "$BASE"

          echo
          echo "========== BUILDER CONFIG HISTORY =========="
          git log -8 --format='%H %ci %s' \
            upstream/master -- configs/defconfig.common tools/config.sh

      - name: Checkout Arduino Core 3.3.12
        shell: bash
        run: |
          set -eu

          git clone \
            https://github.com/espressif/arduino-esp32.git \
            arduino-esp32

          git -C arduino-esp32 checkout --detach 3.3.12

          echo "========== ARDUINO-ESP32 =========="
          git -C arduino-esp32 log -1 --format='%H%n%ci%n%s'
          echo "Tag:"
          git -C arduino-esp32 describe --tags --exact-match HEAD
          echo "Commit:"
          git -C arduino-esp32 rev-parse HEAD

      - name: Checkout ESP-IDF 5.5.5
        shell: bash
        run: |
          set -eu

          git clone \
            https://github.com/espressif/esp-idf.git \
            esp-idf

          git -C esp-idf fetch --force --tags
          git -C esp-idf checkout --detach 'v5.5.5^{commit}'

          echo "========== ESP-IDF =========="
          echo "Tag reference:"
          git -C esp-idf show-ref --tags v5.5.5 || true
          echo "Resolved tag commit:"
          git -C esp-idf rev-parse 'v5.5.5^{commit}'
          echo "Checked-out commit:"
          git -C esp-idf rev-parse HEAD
          echo "Description:"
          git -C esp-idf describe --tags --always
          echo "Commit details:"
          git -C esp-idf log -1 --format='%H%n%ci%n%s'

      - name: Record builder configuration
        shell: bash
        run: |
          echo "========== BUILDER CONFIGURATION =========="

          echo "--- tools/config.sh ---"
          sed -n '1,100p' tools/config.sh

          echo
          echo "--- configs/builds.json ---"
          cat configs/builds.json

          echo
          echo "--- Build script options ---"
          grep -nE \
            'SKIP_ENV|BUILD_TYPE|install-arduino|install-esp-idf|update-components|idf-libs' \
            build.sh || true
